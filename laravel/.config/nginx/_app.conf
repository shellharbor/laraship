charset UTF-8;
        server_tokens off;
        index index.php index.html index.htm;


        #add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        #add_header Referrer-Policy "no-referrer-when-downgrade" always;
        #add_header Permissions-Policy "geolocation=(), microphone=(), camera=()";
        #add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: *; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self'; frame-ancestors 'self';" always;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_pass_header Content-Type;
        proxy_pass_header Content-Disposition;
        proxy_pass_header Content-Length;
        proxy_read_timeout 60;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        proxy_connect_timeout 60;
        proxy_send_timeout 60;
        #
        # proxy_request_buffering off;
        proxy_buffering off;

        client_body_buffer_size 128k;
        client_header_buffer_size 32k;
        client_max_body_size 900M;
        client_body_timeout 60s;
        client_header_timeout 60s;

        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        #fastcgi_busy_buffers_size 512k;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;

        #fastcgi_buffering off;

        gzip on;
        gzip_vary on;
        gzip_static on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_buffers 4 32k;
        gzip_http_version 1.1;
        gzip_min_length 1000;
        gzip_types
            application/atom+xml
            application/javascript
            application/json
            application/ld+json
            application/manifest+json
            application/rss+xml
            application/vnd.geo+json
            application/vnd.ms-fontobject
            application/x-font-ttf
            application/x-web-app-manifest+json
            application/xhtml+xml
            application/xml
            font/opentype
            image/bmp
            image/svg+xml
            image/x-icon
            text/cache-manifest
            text/css
            text/plain
            text/vcard
            text/vnd.rim.location.xloc
            text/vtt
            text/x-component
            text/x-cross-domain-policy;

        open_file_cache max=10000 inactive=30s;
        open_file_cache_valid 2m;
        open_file_cache_min_uses 2;
        open_file_cache_errors on;

        root /var/www/html/public;


        large_client_header_buffers 4 32k;
        keepalive_timeout 60s;
        send_timeout 60s;

        if (!-d $request_filename) {
            rewrite ^/(.+)/$ /$1 permanent;
        }

        access_log /var/log/nginx/access.MYSITE.COM.log;
        error_log  /var/log/nginx/error_warn.MYSITE.COM.log warn;
        error_log  /var/log/nginx/error_crit.MYSITE.COM.log crit;
        error_log  /var/log/nginx/error_debug.MYSITE.COM.log debug;
        rewrite_log on;

#         location /api/products {
#             auth_basic off;
#             try_files $uri $uri/ /index.php?$query_string;
#         }

        location / {
#             auth_basic "Restricted Access";
#             auth_basic_user_file /etc/nginx/.htpasswd;

            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ [^/]\.php(/|$) {
#             auth_basic "Restricted Access";
#             auth_basic_user_file /etc/nginx/.htpasswd;
            try_files $uri /index.php =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 256 4k;
            fastcgi_busy_buffers_size 256k;
            fastcgi_temp_file_write_size 256k;
            fastcgi_connect_timeout 30s;
            fastcgi_read_timeout 300;
            fastcgi_send_timeout 300;

            fastcgi_pass {SLUG}_php:9000;
        }

        location ^~ /.well-known/acme-challenge/ {
            allow all;
            default_type "text/plain";
            root /var/www/certbot;
            try_files $uri =404;

            error_log /var/log/nginx/acme_debug.log debug;
            access_log /var/log/nginx/acme_access.log;
        }

        location ~* \.(?:jpg|jpeg|gif|png|ico|css|bmp|swf|js|mov|avi|mp4|mpeg4|ttf|woff)\$ {
            access_log off;
            expires 30d;
            add_header Pragma public;
            add_header Cache-Control "public, no-transform, mustrevalidate, proxy-revalidate";
        }

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        location ~ ^/(?:data|config|\\.ht|db|readme|vendor|tests) {
            deny all;
            return 403;
        }
        location ~ \.(htaccess|config\.php|readme\.txt|readme\.md|install\.txt|update\.txt|README\..*|COPYING\..*|LICENSE\..*|AUTHORS\..*|CHANGELOG\..*|VERSION\..*|composer\.(json|lock))$ {
            deny all;
            return 403;
        }
        location ~ (composer\.json|composer\.lock|package\.json|package-lock\.json)$ {
            deny all;
        }
        location ~* (?:\.(?:bak|conf|dist|fla|in[ci]|log|psd|sh|sql|sw[op])|~)$ {
            deny all;
        }
        location = /favicon.ico {
            access_log off;
            log_not_found off;
        }
        location = /robots.txt {
            access_log off;
            log_not_found off;
        }

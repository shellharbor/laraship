; Project-specific PHP settings.
; Mounted read-only into the php container as conf.d/zz-project.ini, so it is loaded
; after the image defaults. Empty by default: PHP behaves as in the plain image.
; deploy-laravel.sh --php-upload-max SIZE writes upload_max_filesize and post_max_size here.
; After editing: docker compose restart php
;
; upload_max_filesize = 64M
; post_max_size = 64M
; memory_limit = 256M

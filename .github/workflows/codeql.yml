name: CodeQL

# CodeQL does not support Bash, so the workflow files themselves are analysed
# (language `actions`): unsafe expressions, context injection, excessive permissions.
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "17 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: GitHub Actions analysis
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:actions"

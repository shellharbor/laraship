name: CodeQL

# CodeQL не поддерживает Bash, поэтому анализируются сами workflow-файлы
# (язык `actions`): небезопасные выражения, инъекции через контекст, лишние права.
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "17 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Анализ GitHub Actions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v5

      - name: Инициализация CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none

      - name: Анализ
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:actions"

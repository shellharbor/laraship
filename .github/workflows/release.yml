name: Release

# Pushing a tag vX.Y.Z publishes a GitHub Release: the description comes from the matching section of
# CHANGELOG.md, the asset is the project folder as a tarball with a SHA-256 checksum.
# Tag only when all required checks, including Kubernetes, are green for the commit.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify or complete (for example v1.3.0)
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Publish the release
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Preserve current publication policy and validate the requested tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid release tag"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/laraship-release"
          cp .github/scripts/check-release-ci.py "$RUNNER_TEMP/laraship-release/check-release-ci.py"
          cp .github/scripts/publish-release.py "$RUNNER_TEMP/laraship-release/publish-release.py"

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Require successful CI for the exact tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/laraship-release/check-release-ci.py"

      - name: Check that the tag matches VERSION and CHANGELOG.md
        run: |
          RELEASE="${RELEASE_TAG#v}"
          if [ "$(tr -d '[:space:]' < VERSION)" != "${RELEASE}" ]; then
            echo "::error::tag ${RELEASE_TAG} does not match VERSION ($(cat VERSION))"
            exit 1
          fi
          bash .github/scripts/release-notes.sh "${RELEASE}" CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${RELEASE}"
            exit 1
          fi

      - name: Build the archive and its checksum
        id: revision
        run: |
          COMMIT="$(git rev-parse HEAD)"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          RELEASE="${RELEASE_TAG#v}"
          git archive --format=tar.gz --prefix="laraship-${RELEASE}/" -o "laraship-${RELEASE}.tar.gz" "refs/tags/${RELEASE_TAG}"
          sha256sum "laraship-${RELEASE}.tar.gz" > "laraship-${RELEASE}.tar.gz.sha256"

      - name: Create or verify the release and complete missing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE="${RELEASE_TAG#v}"
          python3 "$RUNNER_TEMP/laraship-release/publish-release.py" \
            --tag "$RELEASE_TAG" --notes-file release-notes.md \
            --asset "laraship-${RELEASE}.tar.gz" \
            --asset "laraship-${RELEASE}.tar.gz.sha256"

  python-package:
    name: Build verified Python distributions
    needs: release
    if: vars.PYPI_PUBLISH == 'true'
    outputs:
      artifact-id: ${{ steps.distributions.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the checked release source
        run: |
          test -f pyproject.toml || { echo "::error::This tag predates Python packaging; publish a new version."; exit 1; }
          python -m pip install -r requirements-python-build.txt
          python -m build
          python -m twine check --strict dist/*
          python .github/scripts/check-python-dist.py dist "$(cat VERSION)"
      - name: Check the installed release wheel
        run: |
          python -m venv "$RUNNER_TEMP/laraship-release"
          "$RUNNER_TEMP/laraship-release/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/laraship-release/bin/laraship" --version
          "$RUNNER_TEMP/laraship-release/bin/laraship" install --backend docker --dry-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: distributions
        with:
          name: python-distributions-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  pypi:
    name: Publish Python distributions to PyPI
    needs: python-package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/laraship/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.python-package.outputs.artifact-id }}
          merge-multiple: true
          path: dist/
      - name: Publish through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  dockerhub:
    name: Publish the CLI image to Docker Hub
    needs: release
    if: vars.DOCKERHUB_IMAGE != '' || vars.DOCKERHUB_USERNAME != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Preserve the current Docker Hub configuration validator
        run: cp .github/scripts/dockerhub-metadata.sh "$RUNNER_TEMP/laraship-dockerhub-metadata.sh"

      - name: Check out the exact commit verified by release publication
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.commit }}
          persist-credentials: false

      - name: Validate Docker Hub settings and release metadata
        id: image
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::Set DOCKERHUB_TOKEN in GitHub Actions Secrets."
            exit 1
          fi
          bash "$RUNNER_TEMP/laraship-dockerhub-metadata.sh" "$RELEASE_TAG" VERSION

      - uses: docker/setup-buildx-action@v4

      - name: Build the CLI image for smoke checks
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: laraship:release-smoke
          cache-from: type=gha,scope=laraship-cli
          labels: |
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.revision=${{ needs.release.outputs.commit }}

      - name: Check the packaged CLI before publishing
        env:
          RELEASE_VERSION: ${{ steps.image.outputs.version }}
        run: |
          test "$(docker run --rm --network none --read-only --tmpfs /tmp laraship:release-smoke --version)" = "deploy-laravel.sh $RELEASE_VERSION"
          docker run --rm --network none --read-only --tmpfs /tmp laraship:release-smoke --help
          docker run --rm --user 1000:1000 --network none --read-only --tmpfs /tmp laraship:release-smoke upgrade --help
          test "$(docker run --rm --network none --read-only --tmpfs /tmp laraship:release-smoke upgrade --version)" = "LaraShip upgrade $RELEASE_VERSION"
          docker run --rm --network none --read-only --tmpfs /tmp laraship:release-smoke deploy --dry-run --domain smoke.example.test --db-type postgres --no-ssl
          docker run --rm --user 1000:1000 --network none --read-only --tmpfs /tmp laraship:release-smoke kubernetes render \
            --name smoke --namespace smoke --image example/app:1.0.0 \
            --configmap smoke-config-v1 --secret smoke-secret-v1 --revision v1

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish the versioned CLI image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.image_tag }}
          cache-from: type=gha,scope=laraship-cli
          cache-to: type=gha,scope=laraship-cli,mode=max
          labels: |
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.revision=${{ needs.release.outputs.commit }}

      - name: Record the image reference and digest
        env:
          IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE }}
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          printf '### Docker Hub CLI image\n\nTag: %s\n\nPinned reference: %s@%s\n' \
            "$IMAGE_TAG" "$IMAGE_NAME" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

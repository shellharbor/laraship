name: Lint

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: ShellCheck, syntax, CRLF
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: bash -n
        run: |
          for f in *.sh tests/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: No CRLF in scripts, templates and tests
        run: |
          if grep -rlI $'\r' -- *.sh laravel nginxproxy tests .github; then
            echo "::error::Files with CRLF found (LF is required)"
            exit 1
          fi

      - name: ShellCheck
        # SC2155 (declare and assign separately) is a style issue in remove.sh: known.
        run: shellcheck -S warning -e SC2155 -- *.sh tests/*.sh

  workflows:
    name: actionlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color

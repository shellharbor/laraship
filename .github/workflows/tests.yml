name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Static checks and argument validation (bats)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats

      # Validation needs root: check_root runs before argument parsing.
      # The script refuses before making any change, but it creates an empty /var/www.
      - name: bats (static + validation)
        run: sudo bats --print-output-on-failure tests/static.bats tests/validation.bats

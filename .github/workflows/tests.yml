name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Static checks and argument validation (bats)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats

      # Validation needs root: check_root runs before argument parsing.
      # The script refuses before making any change, but it creates an empty /var/www.
      - name: bats (static + validation + presets + safety)
        run: sudo bats --print-output-on-failure tests/static.bats tests/validation.bats tests/presets.bats tests/safety.bats tests/hardening.bats
      - name: Python helper behavior
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  python-package:
    name: Python package (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated build and validation tools
        run: python -m pip install -r requirements-python-build.txt
      - name: Check installer and backend behavior
        run: python -m unittest discover -s tests -p 'test_python_cli.py' -v
      - name: Build and validate both distributions
        run: |
          python -m build
          python -m twine check --strict dist/*
          python .github/scripts/check-python-dist.py dist "$(cat VERSION)"
      - name: Install the wheel with pip and run its actual entry point
        run: |
          python -m venv "$RUNNER_TEMP/laraship-pip"
          "$RUNNER_TEMP/laraship-pip/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/laraship-pip/bin/laraship" --version
          "$RUNNER_TEMP/laraship-pip/bin/laraship" install --backend docker --dry-run
      - name: Install from the sdist and with pipx
        env:
          PIPX_HOME: ${{ runner.temp }}/laraship-pipx
          PIPX_BIN_DIR: ${{ runner.temp }}/laraship-pipx-bin
        run: |
          python -m venv "$RUNNER_TEMP/laraship-sdist"
          "$RUNNER_TEMP/laraship-sdist/bin/python" -m pip install dist/*.tar.gz
          "$RUNNER_TEMP/laraship-sdist/bin/python" -m laraship --help
          pipx install dist/*.whl
          "$PIPX_BIN_DIR/laraship" --help
          "$PIPX_BIN_DIR/laraship" install --backend native --directory "$RUNNER_TEMP/laraship-preview" --dry-run
      - name: Verify prerelease distribution names and runtime defaults
        if: matrix.python == '3.12'
        run: bash tests/python-package-prerelease.sh

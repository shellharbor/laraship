name: E2E

# A real Laravel (+ Filament) deployment on a clean runner, checking that the site
# matches the arguments passed, then deactivate/activate/remove.
on:
  push:
    branches: [main, master]
    paths:
      - "*.sh"
      - "Dockerfile"
      - ".dockerignore"
      - "docker/**"
      - "docker-preflight.py"
      - "kubernetes/**"
      - "lib/**"
      - "src/**"
      - "versions.env"
      - "VERSION"
      - "CHANGELOG.md"
      - "modules/**"
      - "laravel/**"
      - "nginxproxy/**"
      - "tests/**"
      - ".github/workflows/e2e.yml"
      - ".github/workflows/kubernetes.yml"
  pull_request:
    paths:
      - "*.sh"
      - "Dockerfile"
      - ".dockerignore"
      - "docker/**"
      - "docker-preflight.py"
      - "kubernetes/**"
      - "lib/**"
      - "src/**"
      - "versions.env"
      - "VERSION"
      - "CHANGELOG.md"
      - "modules/**"
      - "laravel/**"
      - "nginxproxy/**"
      - "tests/**"
      - ".github/workflows/e2e.yml"
      - ".github/workflows/kubernetes.yml"
  schedule:
    - cron: "0 5 * * 1" # Mondays: catch breakage caused by composer/image updates
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-upgrade:
    name: Managed upgrade (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PostgreSQL + Filament
            db: postgres
            php: "83"
            filament: "4"
            repository: ""
          - name: MySQL + Git + Docker CLI
            db: mysql
            php: "82"
            filament: "4"
            repository: "--repository"
          - name: PostgreSQL without Filament
            db: postgres
            php: "83"
            filament: ""
            repository: ""
    steps:
      - uses: actions/checkout@v7
      - name: Build patched source and target runtimes
        env:
          SOURCE_PHP: ${{ matrix.php }}
        run: |
          variants=(83)
          if [ "$SOURCE_PHP" = 82 ]; then variants+=(82); fi
          for variant in "${variants[@]}"; do
            docker build -t "laraship-php:upgrade-$variant" -f "laravel/.docker/php/php$variant.Dockerfile" laravel/.docker/php
          done
      - name: Build the actual Docker CLI adapter
        if: matrix.db == 'mysql'
        run: docker build -t laraship-upgrade-test:1.4.0 .
      - name: Check private output transport and interrupted command cleanup
        env:
          E2E_ALLOW: "1"
        run: sudo -E python3 -B tests/upgrade-runtime-e2e.py
      - name: Check planning, preparation, apply, data retention and recovery
        env:
          E2E_ALLOW: "1"
          UPGRADE_DB: ${{ matrix.db }}
          UPGRADE_SOURCE_PHP: ${{ matrix.php }}
          UPGRADE_FILAMENT: ${{ matrix.filament }}
          UPGRADE_REPOSITORY: ${{ matrix.repository }}
        run: |
          flags=()
          if [ -n "$UPGRADE_FILAMENT" ]; then flags+=(--filament "$UPGRADE_FILAMENT"); fi
          if [ -n "$UPGRADE_REPOSITORY" ]; then flags+=(--repository); fi
          if [ "$UPGRADE_DB" = mysql ]; then flags+=(--cli-image laraship-upgrade-test:1.4.0); fi
          sudo -E python3 -B tests/upgrade-e2e.py --db "$UPGRADE_DB" --source-php "$UPGRADE_SOURCE_PHP" "${flags[@]}"

  php-images:
    name: PHP ${{ matrix.php }} runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        php: ["82", "83"]
    steps:
      - uses: actions/checkout@v7
      - name: Build the pinned PHP runtime
        run: docker build -t laraship-php:smoke -f laravel/.docker/php/php${{ matrix.php }}.Dockerfile laravel/.docker/php
      - name: Check runtime, databases, Laravel and graceful shutdown
        run: python3 tests/php-image-smoke.py --image laraship-php:smoke --variant ${{ matrix.php }}

  e2e:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PostgreSQL + Filament (Laravel 12)
            id: postgres-filament
            db: postgres
            filament: "1"
            laravel: "12.0"
            extras: "0"
            config: "0"
          - name: MySQL, default Laravel version, new options
            id: mysql-extras
            db: mysql
            filament: "0"
            laravel: ""
            extras: "1"
            config: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install bats and free ports 80/443
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats
          sudo systemctl stop apache2 nginx 2>/dev/null || true
          sudo ss -tlnp | grep -E ':(80|443) ' && { echo "::error::ports 80/443 are busy"; exit 1; } || true

      - name: bats e2e
        env:
          E2E_ALLOW: "1"
          E2E_DB: ${{ matrix.db }}
          E2E_FILAMENT: ${{ matrix.filament }}
          E2E_LARAVEL: ${{ matrix.laravel }}
          E2E_EXTRAS: ${{ matrix.extras }}
          E2E_CONFIG: ${{ matrix.config }}
          # The certificate request without DNS is checked only on schedule and manually,
          # so that every PR does not run into Let's Encrypt rate limits.
          E2E_SSL: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && matrix.db == 'mysql' && '1' || '0' }}
          E2E_KEEP_LOG: ${{ runner.temp }}/deploy-${{ matrix.id }}.log
        run: sudo -E bats --print-output-on-failure tests/e2e.bats tests/e2e-proxy.bats tests/e2e-db-migration.bats

      - name: Upload the deployment log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deploy-log-${{ matrix.id }}
          path: ${{ runner.temp }}/deploy-${{ matrix.id }}.log
          if-no-files-found: ignore
          retention-days: 14

  e2e-repo:
    name: Existing application (--repo) and update.sh
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install bats and free ports 80/443
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats
          sudo systemctl stop apache2 nginx 2>/dev/null || true
          sudo ss -tlnp | grep -E ':(80|443) ' && { echo "::error::ports 80/443 are busy"; exit 1; } || true

      - name: bats e2e-repo
        env:
          E2E_ALLOW: "1"
          E2E_KEEP_LOG: ${{ runner.temp }}/deploy-repo.log
        run: sudo -E bats --print-output-on-failure tests/e2e-repo.bats

      - name: Upload the deployment log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deploy-log-repo
          path: ${{ runner.temp }}/deploy-repo.log
          if-no-files-found: ignore
          retention-days: 14

  e2e-modules:
    name: Modules (--with filament,horizon)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install bats and free ports 80/443
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats
          sudo systemctl stop apache2 nginx 2>/dev/null || true
          sudo ss -tlnp | grep -E ':(80|443) ' && { echo "::error::ports 80/443 are busy"; exit 1; } || true

      - name: bats e2e-modules
        env:
          E2E_ALLOW: "1"
          E2E_KEEP_LOG: ${{ runner.temp }}/deploy-modules.log
        run: sudo -E bats --print-output-on-failure tests/e2e-modules.bats

      - name: Upload the deployment log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deploy-log-modules
          path: ${{ runner.temp }}/deploy-modules.log
          if-no-files-found: ignore
          retention-days: 14

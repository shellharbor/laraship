# Description: Closed staging environment: HTTP Basic Auth and Redis; ports on 127.0.0.1 only
#
# A preset is a --config file shipped with the script (see presets/README.md). It only adds
# features: flags and a --config file can change values but cannot switch a preset feature off.
# The Basic Auth user and password are generated unless you pass --auth-user / --auth-password.
ENABLE_BASIC_AUTH=true
WITH=redis
BIND_LOCAL=true

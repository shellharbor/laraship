worker_processes 2;
pcre_jit on;

events {
    use epoll;
    worker_connections 1024;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    keepalive_requests 10000;
    types_hash_max_size 2048;
    server_tokens off;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    disable_symlinks if_not_owner;
    server_names_hash_bucket_size 64;
    server_name_in_redirect off;
    reset_timedout_connection on;

    ####### app #######
    upstream app {
        server app_nginx:80;
    }

    upstream app_https {
        server app_nginx:443;
    }

    upstream app_php {
        server app_php max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name legacy.example.test;

        location / {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        #return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl;
        server_name legacy.example.test;

        charset UTF-8;
        server_tokens off;
        index index.php index.html index.htm;

        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_ecdh_curve secp384r1;

        add_header Strict-Transport-Security "max-age=63072000" always;
        #add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        #add_header Referrer-Policy "no-referrer-when-downgrade" always;
        #add_header Permissions-Policy "geolocation=(), microphone=(), camera=()";
        #add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: *; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self'; frame-ancestors 'self';" always;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_pass_header Content-Type;
        proxy_pass_header Content-Disposition;
        proxy_pass_header Content-Length;
        proxy_read_timeout 60;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        proxy_connect_timeout 60;
        proxy_send_timeout 60;
        #
        # proxy_request_buffering off;
        proxy_buffering off;

        client_body_buffer_size 128k;
        client_header_buffer_size 32k;
        client_max_body_size 900M;
        client_body_timeout 60s;
        client_header_timeout 60s;

        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        #fastcgi_busy_buffers_size 512k;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;

        #fastcgi_buffering off;


        ssl_certificate /etc/letsencrypt/app/live/legacy.example.test/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/app/live/legacy.example.test/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/app/live/legacy.example.test/chain.pem;

        large_client_header_buffers 4 32k;
        keepalive_timeout 60s;
        send_timeout 60s;

        access_log /var/log/nginx/access.legacy.example.test.log;
        error_log  /var/log/nginx/error_warn.legacy.example.test.log warn;
        error_log  /var/log/nginx/error_crit.legacy.example.test.log crit;
        error_log  /var/log/nginx/error_debug.legacy.example.test.log debug;

        location / {
            proxy_pass https://app_https;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}